keycloak:
  global:
    security:
      allowInsecureImages: true

  commonLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "authorization"
    mapcolonies.io/owner: "infra"
    mapcolonies.io/alloy-api-logs: "false"
    mapcolonies.io/criticality: "internal"

  serviceAccount:
    create: false

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
      ephemeral-storage: 50Mi
    limits:
      cpu: 800m
      memory: 768Mi
      ephemeral-storage: 2Gi

  metrics:
    enabled: true

  postgresql:
    enabled: false

  proxy: "edge"
  
  production: true
