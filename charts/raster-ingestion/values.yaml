# ====================================================================================================
# Gpkg-Merger
# ====================================================================================================
# TODO: no image pull policy set for this container inside service, add when supported by the service helm
gpkg-merger:
  image:
    repository: raster/tiles-merger-service
    tag: "v2.2.3"
  isExporter: false
  env:
    general:
      validate: false
    TASK:
      types:
        - jobType: "Ingestion_New"
          taskType: "tilesMerging"
        - jobType: "Ingestion_Update"
          taskType: "tilesMerging"
        - jobType: "Ingestion_Swap_Update"
          taskType: "tilesMerging"
      pollingTime: 3000 # TODO: fix default value inside the service
    heartbeat:
      intervalMs: 3000 # TODO: fix default value inside the service


# ====================================================================================================
# MapProxy-Api
# ====================================================================================================
# TODO: no image pull policy set for this container inside service, add when supported by the service helm
mapproxy-api:
  image:
    repository: raster/mapproxy-api
    tag: "v1.14.0"
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  db:
    schema: "MapproxyConfig" # TODO: remove after set this as the default value within service


# ====================================================================================================
# Cache-Seeder
# ====================================================================================================
cache-seeder:
  image:
    repository: "raster/cache-seeder"
    tag: "v2.3.2"
    pullPolicy: IfNotPresent # TODO: remove after set this as the default value within service
  env:
    seedConcurrency: 25


# ====================================================================================================
# Ingestion-Trigger
# ====================================================================================================
ingestion-trigger:
  image:
    repository: raster/ingestion-trigger
    tag: v4.5.1
  imagePullPolicy: IfNotPresent # TODO: remove after set this as the default value within service
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  env:
    productReader:
      maxVerticesPerChunk: 20000
    supportedIngestionSwapTypes:
      - productType: "RasterVectorBest"
        productSubType: "עבירות"


# ====================================================================================================
# Overseer
# ====================================================================================================
overseer:
  image:
    repository: raster/overseer
    tag: v2.11.1
    pullPolicy: IfNotPresent # TODO: remove after set this as the default value within service
  configManagement:
    offlineMode:  # TODO: remove after set this as the default value within service
  instanceType: "ingestion"


# ====================================================================================================
# Geoserver-Api
# ====================================================================================================
geoserver-api:
  image:
    repository: raster/geoserver-api
    tag: v2.1.0
  imagePullPolicy: IfNotPresent # TODO: remove after set this as the default value within service
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  db:
    schema: "polygon_parts" # TODO: remove after set this as the default value within service
    dbType: "postgis"

# ====================================================================================================
# Polygon-Parts-Worker
# ====================================================================================================
polygon-parts-worker:
  image:
    repository: raster/polygon-parts-worker
    tag: v2.3.1
  instanceType: ingestion
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  jobManagement:
    config:
      dequeueIntervalMs: 30000
  jobDefinitions:
    tasks:
      validation:
        reportsDownloadPath: "/validation-reports"
