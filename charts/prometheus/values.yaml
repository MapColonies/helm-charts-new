prometheus:
  fullnameOverride: infra-prometheus

  # Chart-owned. This is the upstream chart's only `tpl`-templated scrape seam, so every job
  # this chart generates flows through it. A site that sets this key loses all of them at
  # once, and the render still succeeds. Never set it in site-values. See README.md.
  extraScrapeConfigs: '{{ include "prometheus.mapcolonies.scrapeConfigs" . }}'

  # Inputs to the generated scrape configuration. These must stay under the `prometheus`
  # subchart key: the seam above is rendered in the subchart's context, so the umbrella's top
  # level is not visible to it.
  mapcolonies:
    scrape:
      selfScrape:
        enabled: true

  # Every built-in scrape job of the upstream subchart is disabled here; this chart owns its
  # scrape configuration. See README.md before re-enabling any of them.
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false


  commonMetaLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "monitoring"
    mapcolonies.io/owner: "infra"

  serviceAccounts:
    server:
      create: false
      name: monitoring

  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  rbac:
    create: false


  server:
    fullnameOverride: 'infra-prometheus-server'
    podLabels:
      mapcolonies.io/alloy-api-logs: "true"
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    extraFlags:
      - web.enable-lifecycle

    persistentVolume:
      existingClaim: infra-prometheus-storage

    service:
      servicePort: 9090
