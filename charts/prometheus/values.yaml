prometheus:
  fullnameOverride: infra-prometheus

  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
    # Upstream default probe job; sends probes to a non-existent "blackbox" host. Replaced by blackbox-services.
    kubernetes-services:
      enabled: false
    # Blackbox probes for Services annotated with prometheus.io/probe: "true" (see blackbox-lib).
    blackbox-services:
      metrics_path: /probe
      kubernetes_sd_configs:
        - role: service
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
          action: keep
          regex: "true"
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_host]
          action: keep
          regex: .+
        - target_label: __param_module
          replacement: http_2xx
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_module]
          regex: (.+)
          target_label: __param_module
        - target_label: __tmp_probe_scheme
          replacement: http
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_scheme]
          regex: (https?)
          target_label: __tmp_probe_scheme
        - source_labels:
            - __tmp_probe_scheme
            - __meta_kubernetes_service_annotation_prometheus_io_probe_host
            - __meta_kubernetes_service_annotation_prometheus_io_probe_path
          regex: (.+);(.+);(.*)
          replacement: $1://$2$3
          target_label: __param_target
        - target_label: __address__
          replacement: infra-blackbox-exporter:9115
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe_exporter]
          regex: (.+)
          target_label: __address__
        - source_labels: [__param_target]
          target_label: instance
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service


  commonMetaLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "monitoring"
    mapcolonies.io/owner: "infra"
    mapcolonies.io/criticality: "customer"

  serviceAccounts:
    server:
      create: false
      name: monitoring

  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  rbac:
    create: false


  server:
    fullnameOverride: 'infra-prometheus-server'
    podLabels:
      mapcolonies.io/alloy-api-logs: "true"
      mapcolonies.io/criticality: "customer"
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    extraFlags:
      - web.enable-lifecycle

    persistentVolume:
      existingClaim: infra-prometheus-storage

    service:
      servicePort: 9090
