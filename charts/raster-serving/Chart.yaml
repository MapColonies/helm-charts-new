apiVersion: v2
name: raster-serving
description: A Helm chart for Raster serving services
annotations:
  domain: raster
type: application
version: 1.0.0
dependencies:
  - name: mapproxy
    version: 2.1.3
    condition: mapproxy.enabled
    repository: oci://acrarolibotnonprod.azurecr.io/helm/raster

  - name: pycsw
    version: 6.7.2
    condition: pycsw.enabled
    repository: oci://acrarolibotnonprod.azurecr.io/helm/raster

  - name: pycsw
    version: 6.7.2
    condition: pycsw-private.enabled
    repository: oci://acrarolibotnonprod.azurecr.io/helm/raster
    alias: pycsw-private

  - name: pp-geoserver
    version: 3.3.1
    condition: pp-geoserver.enabled
    repository: oci://acrarolibotnonprod.azurecr.io/helm/raster

  - name: redis
    version: 18.5.0
    condition: redis.enabled
    repository: https://charts.bitnami.com/bitnami
