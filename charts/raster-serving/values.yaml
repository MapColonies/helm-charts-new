# ====================================================================================================
# Pycsw
# ====================================================================================================
pycsw:
  image:
    repository: common/pycsw
    tag: &pycswVersion "v6.7.2"

  filterProductStatus: true

  env:
    uwsgi:
      processes: 6
      threads: 2
    db:
      schema: RasterCatalogManager
      requirePassword: true

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "v1.3.0"

  nginx:
    image:
      repository: common/nginx
      tag: "v2.3.1"
    nameOverride: pycsw-nginx
    mclabels:
      partOf: serving
      owner: raster
    prometheusExporter:
       image:
         repository: common/nginx/nginx-prometheus-exporter
         tag: 1.4.1


# ====================================================================================================
# Pycsw-Private
# ====================================================================================================
pycsw-private:
  image:
    repository: common/pycsw
    tag: *pycswVersion

  mclabels:
    logScraping: true # TODO: fix the key typo in service

  env:
    uwsgi:
      processes: 6
      threads: 2
    db:
      schema: RasterCatalogManager
      requirePassword: true

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "v1.3.0"

  nginx:
    image:
      repository: common/nginx
      tag: "v2.3.1"
    nameOverride: pycsw-private-nginx
    mclabels:
      partOf: serving
      owner: raster
    prometheusExporter:
       image:
         repository: common/nginx/nginx-prometheus-exporter
         tag: 1.4.1


# ====================================================================================================
# MapProxy
# ====================================================================================================
mapproxy:
  db:
    schema: MapproxyConfig # TODO: remove after set this as the default value within service

  metrics:
    enabled: true
    url: "localhost:8080" # TODO: this is irrelevant for metrics but needed to enabled the metrics, should be removed after handle within service

  mclabels:
    prometheus:
      port: 9117 # TODO: remove after update the prometues port within service as default value

  storage:
    mapproxyConfigProvider: DB

  initContainer:
    image:
      repository: mapproxinator
      tag: "v1.2.5"

  mapproxinator:
    image:
      repository: mapproxinator
      tag: "v1.2.5"

  mapproxy:
    image:
      repository: raster/docker-mapproxy
      tag: "v2.1.3"
    uwsgi:
      processes: 6
      threads: 2

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "v1.3.0"

  nginx:
    image:
      repository: common/nginx
      tag: "v2.3.1"
    nameOverride: mapproxy-nginx
    mclabels:
      partOf: serving
      owner: raster


# ====================================================================================================
# Redis
# ====================================================================================================
redis:
  debug: false
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.1
  commonConfiguration: |-
    # Enable AOF https:redis.io/topics/persistence#append-only-file
    appendonly no
    protected-mode no
    # Disable RDB https, AOF persistence already enabled.
    save ""
  metrics:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.55.0-debian-11-r2
  master:
    containerSecurityContext:
      enabled: false
    count: 1
    disableCommands:
      - FLUSHALL
    kind: StatefulSet
    persistence:
      accessModes:
        - ReadWriteMany
      enabled: false
      size: 1Gi
      storageClass: nfs
    podLabels:
      app: redis
      role: master
    podSecurityContext:
      enabled: false
    serviceAccount:
      create: false

# ====================================================================================================
# PP-Geoserver
# ====================================================================================================
pp-geoserver:
  image:
    geoserverRepository: geoserver-os
    geoserverTag: "v2.0.0-2.26.0"
    sidecarRepository: raster/geoserver-polygon-parts
    sidecarTag: "v3.3.1"

  nameOverride: "pp-geoserver"

  mclabels:
    logScraping: true # TODO: fix the key typo in service

  nginx:
    image:
      repository: common/nginx
      tag: "v2.3.1"
    nameOverride: pp-geoserver-nginx
    mclabels:
      partOf: serving
      owner: raster
    prometheusExporter:
      image:
        repository: common/nginx/nginx-prometheus-exporter
        tag: 1.4.1
