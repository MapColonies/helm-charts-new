# ====================================================================================================
# Pycsw
# ====================================================================================================
pycsw:
  enabled: true
  image:
    repository: common/pycsw
    tag: "v6.4.2"

  filterProductStatus: true

  env:
    uwsgi:
      processes: 6
      threads: 2
    db:
      schema: RasterCatalogManager
      requirePassword: true

  nginx:
    fullnameOverride: "{{ .Release.Name }}-pycsw-nginx"
    image:
      repository: common/nginx-otel-unprivileged
      tag: "v2.1.6"
    extraVolumes:
      - name: nginx-config
        configMap:
          name: "{{ .Release.Name }}-pycsw-nginx-configmap"

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "latest"

# ====================================================================================================
# Pycsw-Private
# ====================================================================================================
pycsw-private:
  enabled: true
  image:
    repository: common/pycsw
    tag: "v6.4.2"

  env:
    uwsgi:
      processes: 6
      threads: 2
    db:
      schema: RasterCatalogManager
      requirePassword: true

  nginx:
    fullnameOverride: "{{ .Release.Name }}-pycsw-private-nginx"
    image:
      repository: common/nginx
      tag: "v2.1.6"
    extraVolumes:
      - name: nginx-config
        configMap:
          name: "{{ .Release.Name }}-pycsw-private-nginx-configmap"

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "latest"


# ====================================================================================================
# MapProxy
# ====================================================================================================
mapproxy:
  enabled: true

  db:
    schema: MapproxyConfig

  storage:
    mapproxyConfigProvider: DB

  initContainer:
    image:
      repository: mapproxinator
      tag: "v1.2.5"

  mapproxinator:
    image:
      repository: mapproxinator
      tag: "v1.2.5"

  mapproxy:
    image:
      repository: raster/docker-mapproxy
      tag: "v1.9.2"
    uwsgi:
      processes: 6
      threads: 2
    env:
      cors:
        enabled: true
        allowedOrigin: "*"
        allowedHeaders: "*"

  nginx:
    image:
      repository: nginx-otel-unprivileged
      tag: "v1.0.0"
    enabled: true

  uwsgiExporter:
    image:
      repository: "timonwong/uwsgi-exporter"
      tag: "latest"

# ====================================================================================================
# Redis
# ====================================================================================================
redis:
  enabled: true
  debug: false
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.1
  metrics:
    enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-exporter
      tag: 1.55.0-debian-11-r2
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    containerSecurityContext:
      enabled: false

# ====================================================================================================
# PP-Geoserver
# ====================================================================================================
pp-geoserver:
  enabled: true
  image:
    geoserverRepository: geoserver-os
    geoserverTag: "v2.0.0-2.26.0"
    sidecarRepository: raster/geoserver-polygon-parts
    sidecarTag: "v3.0.0"

  nameOverride: "pp-geoserver"

  nginx:
    enabled: true
    image:
      repository: nginx-otel-unprivileged
      tag: "v1.0.0"
