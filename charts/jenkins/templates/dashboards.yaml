{{- if .Values.dashboards.enabled }}
{{- if hasKey .Values.dashboards "datasourceUid" }}
{{- fail "dashboards.datasourceUid was renamed to dashboards.prometheusDatasourceUid" }}
{{- end }}
{{- $dsUid := required "dashboards.prometheusDatasourceUid is required" .Values.dashboards.prometheusDatasourceUid }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboards
  namespace: {{ .Values.dashboards.namespace | default .Release.Namespace }}
  labels:
    mapcolonies.io/grafana-dashboards: "true"
  annotations:
    mapcolonies.io/grafana-dashboards-folder: {{ .Values.dashboards.folder | quote }}
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
{{- $json := $.Files.Get $path | replace "__DATASOURCE_UID__" $dsUid }}
{{- if hasKey (fromJson $json) "Error" }}
{{- fail (printf "%s: invalid JSON" $path) }}
{{- end }}
{{- if regexMatch "__[A-Z][A-Z_]*__" $json }}
{{- fail (printf "%s: placeholder %s left after rendering" $path (regexFind "__[A-Z][A-Z_]*__" $json)) }}
{{- end }}
  {{ base $path }}: |-
{{ $json | indent 4 }}
{{- end }}
{{- end }}
