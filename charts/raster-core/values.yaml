# ====================================================================================================
# Raster-Catalog-Manager
# ====================================================================================================
raster-catalog-manager:
  enabled: true
  image:
    repository: raster/raster-catalog-manager
    tag: "v7.2.0"
  configManagement:
    offlineMode: true
  db:
    schema: "RasterCatalogManager"


# ====================================================================================================
# Job-Tracker
# ====================================================================================================
job-tracker:
  enabled: true
  image:
    repository: raster/job-tracker
    tag: "v5.2.0"
  configManagement:
    offlineMode: true

  taskFlowManager:
    ingestionTasksFlow:
      - validation
      - create-tasks
      - tilesMerging
      - tiles-deletion
      - finalize
    exportTasksFlow:
      - init
      - tilesExporting
      # - polygon-parts # disabled by deisgn until we will support it
      - finalize
    seedTasksFlow:
      - TilesSeeding


# ====================================================================================================
# Polygon-Parts-Worker
# ====================================================================================================
polygon-parts-worker:
  enabled: true
  image:
    repository: raster/polygon-parts-worker
    tag: v2.2.0
  configManagement:
    offlineMode: true
  jobManagement:
    config:
      dequeueIntervalMs: 30000
  jobDefinitions:
    tasks:
      validation:
        reportsDownloadPath: "/validation-reports" 


# ====================================================================================================
# Polygon-Parts-Manager
# ====================================================================================================
polygon-parts-manager:
  enabled: true
  image:
    repository: raster/polygon-parts-manager
    tag: v3.3.1
  imagePullPolicy: IfNotPresent # TODO: set the default value in the service as `IfNotPresent`
  configManagement:
    offlineMode: true
  env:
    application:
      entities:
        polygonParts:
          minAreaSquareDeg: 1e-12 # TODO: remove after set this as the default value within service
      validation:
        areaThresholdSquareMeters: 10 # TODO: remove after set this as the default value within service
  db:
    schema: "polygon_parts"


# ====================================================================================================
# Cleaner
# ====================================================================================================
cleaner:
  enabled: true
  image:
    repository: raster/cleaner
    tag: "v1.1.3"
  configManagement:
    offlineMode: true
    version: "latest" # TODO: remove after set this as the default value within service
  env:
    targetPort: 8080 # TODO - remove after set this as the default value within service
    jobnik:
      worker: # TODO - remove after set this as the default value within service
        concurrency: 1
    worker:
      capabilities:
        pairs: # TODO - remove after set this as the default value within service
          - job: "Ingestion_Update"
            task: "tiles-deletion"


# ====================================================================================================
# Files-Server
# ====================================================================================================
files-server:
  enabled: true
  nginx:
    enabled: true
    image:
      repository: common/nginx
      tag: v2.1.5
    imagePullPolicy: IfNotPresent # TODO: set the default value in the service (nginx repo) as `IfNotPresent`
    route:
      rewriteTarget: "/"

    prometheusExporter:
      enabled: true
      image:
        repository: common/nginx/nginx-prometheus-exporter
        tag: 1.4.1
 
  

# ====================================================================================================
# Nginx-S3-Gateway
# ====================================================================================================
nginx-s3-gateway:
  enabled: true
  image:
    repository: common/nginx-s3-gateway
    tag: v3.0.2
