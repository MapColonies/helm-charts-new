# ====================================================================================================
# Exporter-Gpkg-Merger
# ====================================================================================================
exporter-gpkg-merger:
  image:
    repository: raster/tiles-merger-service
    tag: "v2.2.3"
  isExporter: true
  env:
    general:
      validate: false
    TASK:
      types:
        - jobType: "Export"
          taskType: "tilesExporting"
      pollingTime: 3000 # TODO: fix default value inside the service
    heartbeat:
      intervalMs: 3000 # TODO: fix default value inside the service

# ====================================================================================================
# Exporter-Trigger
# ====================================================================================================
exporter-trigger:
  image:
    repository: raster/exporter-trigger
    tag: v3.3.0
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  
# ====================================================================================================
# Exporter-Overseer
# ====================================================================================================
exporter-overseer:
  image:
    repository: raster/overseer
    tag: v2.11.1
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  instanceType: export
  mclabels:
    partOf: export

# ====================================================================================================
# Polygon-Parts-Worker
# ====================================================================================================
exporter-polygon-parts-worker:
  image:
    repository: raster/polygon-parts-worker
    tag: v2.3.1
  instanceType: export
  configManagement:
    offlineMode: true # TODO: remove after set this as the default value within service
  mclabels:
    partOf: export
  jobManagement:
    config:
      dequeueIntervalMs: 30000
