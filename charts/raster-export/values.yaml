# ====================================================================================================
# Exporter-Gpkg-Merger
# ====================================================================================================
exporter-gpkg-merger:
  enabled: true
  image:
    repository: raster/tiles-merger-service
    tag: "v2.2.3"
  isExporter: true
  env:
    general:
      validate: false
    TASK:
      types:
        - jobType: "Export"
          taskType: "tilesExporting"
      pollingTime: 3000 # TODO: fix default value inside the service
    heartbeat:
      intervalMs: 3000 # TODO: fix default value inside the service

# ====================================================================================================
# Exporter-Trigger
# ====================================================================================================
exporter-trigger:
  enabled: true
  image:
    repository: raster/exporter-trigger
    tag: v3.3.0
  configManagement:
    offlineMode: true

# ====================================================================================================
# Exporter-Overseer
# ====================================================================================================
exporter-overseer:
  enabled: true
  image:
    repository: raster/overseer
    tag: v2.8.0
  configManagement:
    offlineMode: true
  instanceType: &instanceType "export"
  mclabels:
    partOf: *instanceType

# ====================================================================================================
# Polygon-Parts-Worker
# ====================================================================================================
exporter-polygon-parts-worker:
  enabled: true
  image:
    repository: raster/polygon-parts-worker
    tag: v2.3.0
  instanceType: &instanceType "export"
  mclabels:
    partOf: *instanceType
  configManagement:
    offlineMode: true
  jobManagement:
    config:
      dequeueIntervalMs: 30000
  jobDefinitions:
    tasks:
      validation:
        reportsDownloadPath: "/validation-reports" 

