# Three containers, only sidecar breaks the rule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-container
  template:
    metadata:
      labels:
        app: multi-container
    spec:
      containers:
      - name: app
        image: nginx
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 128Mi
      - name: sidecar
        image: nginx
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: proxy
        image: nginx
        resources:
          requests:
            cpu: 250m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 128Mi
