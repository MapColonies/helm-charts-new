# Guaranteed QoS (request == limit) is a violation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-equals-limit
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-equals-limit
  template:
    metadata:
      labels:
        app: request-equals-limit
    spec:
      containers:
      - name: app
        image: nginx
        resources:
          requests:
            cpu: '1'
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 128Mi
