# The same non-compliant workload in the unlisted namespace sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad
  template:
    metadata:
      labels:
        app: bad
    spec:
      containers:
      - name: app
        image: nginx
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 128Mi
