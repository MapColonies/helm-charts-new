# A CPU request that is not a quantity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unparseable
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unparseable
  template:
    metadata:
      labels:
        app: unparseable
    spec:
      containers:
      - name: app
        image: nginx
        resources:
          requests:
            cpu: lots
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 128Mi
