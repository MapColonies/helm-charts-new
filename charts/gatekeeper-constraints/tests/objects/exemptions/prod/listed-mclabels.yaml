# In the exemption list for mclabels only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listed-mclabels
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listed-mclabels
  template:
    metadata:
      labels:
        app: listed-mclabels
    spec:
      containers:
      - name: app
        image: nginx:1.26
