# Exempts itself from the mclabels rule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotated-mclabels
  namespace: prod
  annotations:
    mapcolonies.io/exempt-mclabels: Third-party chart, labels not configurable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: annotated-mclabels
  template:
    metadata:
      labels:
        app: annotated-mclabels
    spec:
      containers:
      - name: app
        image: nginx:1.26
