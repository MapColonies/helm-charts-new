# UPDATE that only changes the workload's own labels and annotations.
apiVersion: admission.k8s.io/v1
kind: AdmissionReview
request:
  uid: "1"
  operation: UPDATE
  kind:
    group: apps
    version: v1
    kind: Deployment
  resource:
    group: apps
    version: v1
    resource: deployments
  name: web
  namespace: app-dev
  userInfo:
    username: tester
  object:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      namespace: app-dev
      annotations:
        deployment.kubernetes.io/revision: '2'
        team: web
      labels:
        team: web
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
          - name: app
            image: nginx:1.26
  oldObject:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
      namespace: app-dev
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: web
      template:
        metadata:
          labels:
            app: web
        spec:
          containers:
          - name: app
            image: nginx:1.26
