apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-part-of
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-part-of
  template:
    metadata:
      labels:
        mapcolonies.io/owner: app
        mapcolonies.io/environment: dev
        mapcolonies.io/component: frontend
        app: missing-part-of
    spec:
      containers:
      - name: app
        image: nginx
