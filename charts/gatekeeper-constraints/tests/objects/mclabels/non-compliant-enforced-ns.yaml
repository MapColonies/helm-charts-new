apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: non-compliant
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: non-compliant
  template:
    metadata:
      labels:
        mapcolonies.io/environment: dev
        mapcolonies.io/part-of: web
        mapcolonies.io/component: frontend
        app: non-compliant
    spec:
      containers:
      - name: app
        image: nginx
  serviceName: non-compliant
