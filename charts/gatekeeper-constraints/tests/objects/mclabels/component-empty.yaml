apiVersion: apps/v1
kind: Deployment
metadata:
  name: component-empty
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: component-empty
  template:
    metadata:
      labels:
        mapcolonies.io/owner: app
        mapcolonies.io/environment: dev
        mapcolonies.io/part-of: web
        mapcolonies.io/component: ''
        app: component-empty
    spec:
      containers:
      - name: app
        image: nginx
