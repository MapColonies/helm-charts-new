apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valid-sts
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valid-sts
  template:
    metadata:
      labels:
        mapcolonies.io/owner: app
        mapcolonies.io/environment: dev
        mapcolonies.io/part-of: web
        mapcolonies.io/component: frontend
        app: valid-sts
    spec:
      containers:
      - name: app
        image: nginx
  serviceName: valid-sts
