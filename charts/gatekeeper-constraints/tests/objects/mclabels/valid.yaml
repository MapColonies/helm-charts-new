apiVersion: apps/v1
kind: Deployment
metadata:
  name: valid
  namespace: app-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valid
  template:
    metadata:
      labels:
        mapcolonies.io/owner: app
        mapcolonies.io/environment: dev
        mapcolonies.io/part-of: web
        mapcolonies.io/component: frontend
        app: valid
    spec:
      containers:
      - name: app
        image: nginx
