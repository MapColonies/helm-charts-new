    - violations: 'yes'
  - name: listed-name-other-namespace
    object: ../objects/exemptions/prod/listed-name-other-namespace.yaml
    assertions:
    - violations: 'yes'
  - name: annotated-for-this-rule
    object: ../objects/exemptions/prod/annotated-cpu-ratio.yaml
    assertions:
    - violations: 'no'
  - name: annotated-for-other-rule
    object: ../objects/exemptions/prod/annotated-mclabels.yaml
    assertions:
    - violations: 'yes'
  - name: annotated-empty
    object: ../objects/exemptions/prod/annotated-empty.yaml
    assertions:
    - violations: 'yes'
  - name: annotated-on-pod-template
    object: ../objects/exemptions/prod/annotated-pod-template.yaml
    assertions:
    - violations: 'yes'
