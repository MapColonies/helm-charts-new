  - name: listed-for-other-rule
    object: ../objects/exemptions/prod/listed-mclabels.yaml
    assertions:
    - violations: 'yes'
  - name: listed-for-both-rules
    object: ../objects/exemptions/prod/listed-both.yaml
    assertions:
    - violations: 'no'
  - name: listed-name-other-kind
    object: ../objects/exemptions/prod/listed-name-other-kind.yaml
