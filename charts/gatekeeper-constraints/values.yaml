namespaces: []

constraints:
  k8sRequiredLabels:
    enabled: true
    enforcementAction: warn
    labels:
      - "app.kubernetes.io/name"
      - "app.kubernetes.io/instance"
      - "app.kubernetes.io/version"
      - "app.kubernetes.io/managed-by"
      - "mapcolonies.io/part-of"
      - "mapcolonies.io/owner"
      - "mapcolonies.io/environment"
      - "mapcolonies.io/component"
      - "mapcolonies.io/criticality"

  k8sRequiredAnnotations:
    enabled: true
    enforcementAction: warn
    annotations:
      - "prometheus.io/path"
      - "prometheus.io/port"
      - "prometheus.io/scrape"

  k8sDisallowedLabelValues:
    enabled: true
    enforcementAction: warn
    labels:
      - key: "mapcolonies.io/environment"
        disallowedValues:
          - "undefined"

# Workload policies: rules for apps/v1 Deployments and StatefulSets, read from
# their Pod template (see README).
workloadPolicies:
  # Namespaces where a violation is a warning (warn Constraints) and where it
  # gets each rule's enforcementAction, deny by default (enforced Constraints).
  # Gatekeeper globs such as "*-dev" work. Unlike Gatekeeper, an empty list
  # matches nothing: its Constraints are not rendered.
  warnNamespaces: []
  enforcedNamespaces: []

  # Workloads exempt from a rule, reviewed by PR. namespace, kind and name match
  # exactly (no wildcards); rules is cpuRatio, mclabels or both; reason is
  # required, and rendering fails without it. A workload can also exempt itself
  # with a non-empty mapcolonies.io/exempt-cpu-ratio or
  # mapcolonies.io/exempt-mclabels annotation on its own metadata.
  exemptions: []
  # - namespace: raster-prod
  #   kind: Deployment
  #   name: mapproxy
  #   rules: [cpuRatio]
  #   reason: Guaranteed QoS, request == limit on purpose

  cpuRatio:
    enabled: true
    # Action in enforced namespaces: deny, warn or dryrun.
    enforcementAction: deny

  mclabels:
    enabled: true
    # Action in enforced namespaces: deny, warn or dryrun.
    enforcementAction: deny
