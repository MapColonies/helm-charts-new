{{- /* Lets Alloy list and tail the Pods of this namespace (the Gatekeeper controller-manager),
       which deployAlerts needs. See README, "Alloy access". */}}
{{- if .Values.alloyAccess.enabled }}
{{- $sa := .Values.alloyAccess.serviceAccount }}
{{- if not $sa.namespace }}
{{- fail "alloyAccess.serviceAccount.namespace is required when alloyAccess.enabled is true" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa.name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa.name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa.name }}
    namespace: {{ $sa.namespace }}
{{- end }}
