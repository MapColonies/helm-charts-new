{{- if .Values.workloadPolicies.mclabels.enabled }}
{{- $action := include "gatekeeper-constraints.enforcementAction" (dict "root" . "rule" "mclabels") }}
{{- $exemptions := include "gatekeeper-constraints.workloadExemptions" (dict "root" . "rule" "mclabels") | fromYamlArray }}
{{- /* An empty list would match every namespace in Gatekeeper, so render nothing. */}}
{{- with .Values.workloadPolicies.enforcedNamespaces }}
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sWorkloadMcLabels
metadata:
  name: workload-mclabels-enforced
spec:
  enforcementAction: {{ $action | quote }}
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet"]
    namespaces:
      {{- toYaml . | nindent 6 }}
  parameters:
    exemptions: {{- if $exemptions }}
      {{- toYaml $exemptions | nindent 6 }}
    {{- else }} []
    {{- end }}
{{- end }}
{{- end }}
