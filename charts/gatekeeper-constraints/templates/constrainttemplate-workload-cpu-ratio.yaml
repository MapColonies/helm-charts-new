{{- if .Values.workloadPolicies.cpuRatio.enabled }}
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sworkloadcpuratio
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  crd:
    spec:
      names:
        kind: K8sWorkloadCpuRatio
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        {{- .Files.Get "rego/workload-cpu-ratio.rego" | nindent 8 }}
{{- end }}
