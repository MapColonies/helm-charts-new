{{- if .Values.workloadPolicies.cpuRatio.enabled }}
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sworkloadcpuratio
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  crd:
    spec:
      names:
        kind: K8sWorkloadCpuRatio
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptions:
              type: array
              items:
                type: object
                properties:
                  namespace:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  reason:
                    type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      libs:
        - |
          {{- include "gatekeeper-constraints.workloadRego" (dict "root" . "path" "rego/lib/workload.rego") | nindent 10 }}
      rego: |
        {{- include "gatekeeper-constraints.workloadRego" (dict "root" . "path" "rego/workload-cpu-ratio.rego") | nindent 8 }}
{{- end }}
