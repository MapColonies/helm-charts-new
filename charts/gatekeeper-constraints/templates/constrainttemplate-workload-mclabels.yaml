{{- if .Values.workloadPolicies.mclabels.enabled }}
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sworkloadmclabels
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  crd:
    spec:
      names:
        kind: K8sWorkloadMcLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptions:
              type: array
              items:
                type: object
                properties:
                  namespace:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  reason:
                    type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      libs:
        - |
          {{- .Files.Get "rego/lib/workload.rego" | required "chart file rego/lib/workload.rego is missing or empty" | nindent 10 }}
      rego: |
        {{- .Files.Get "rego/workload-mclabels.rego" | required "chart file rego/workload-mclabels.rego is missing or empty" | nindent 8 }}
{{- end }}
