{{- if .Values.workloadPolicies.mclabels.enabled }}
apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sworkloadmclabels
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  crd:
    spec:
      names:
        kind: K8sWorkloadMcLabels
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        {{- .Files.Get "rego/workload-mclabels.rego" | nindent 8 }}
{{- end }}
