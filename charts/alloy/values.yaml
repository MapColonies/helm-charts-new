namespaces:
  - default

alloy:
  image:
    repository: infra/grafana/alloy
  serviceAccount:
    create: false
    name: alloy-kube-api
  rbac:
    create: false
  configReloader:
    image:
      repository: infra/grafana/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0

  crds:
    create: false

  controller:
    type: 'deployment'
    podLabels:
      mapcolonies.io/component: "infrastructure"
      mapcolonies.io/part-of: "monitoring"
      mapcolonies.io/owner: "infra"
      mapcolonies.io/criticality: "internal"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"

  alloy:
    enableReporting: false
    stabilityLevel: "experimental"
    clustering:
      enabled: true
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    configMap:
      create: false
      name: infra-alloy

# Collects the logs of pods labeled mapcolonies.io/alloy-api-logs=true through the Kubernetes API.
# A StatefulSet, so each replica keeps its read positions on its own PVC across restarts and
# rollouts and resumes instead of re-reading the logs. The replicas split the pods between them
# (clustering), so each line is shipped once.
alloy-logs:
  image:
    repository: infra/grafana/alloy
  serviceAccount:
    create: false
    name: alloy-kube-api
  rbac:
    create: false
  configReloader:
    image:
      repository: infra/grafana/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0

  crds:
    create: false

  controller:
    type: 'statefulset'
    replicas: 3
    # Delete a replica's PVC when it's scaled away (and on uninstall), so a later scale-up starts
    # that replica clean instead of resuming from positions that are stale by then
    enableStatefulSetAutoDeletePVC: true
    # Uses the cluster's default StorageClass; to choose one, set spec.storageClassName here.
    # Overriding this list replaces it, so give the whole claim template (not --set on one field).
    volumeClaimTemplates:
      - metadata:
          name: storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    podLabels:
      mapcolonies.io/component: "infrastructure"
      mapcolonies.io/part-of: "monitoring"
      mapcolonies.io/owner: "infra"
      mapcolonies.io/criticality: "internal"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"

  alloy:
    enableReporting: false
    stabilityLevel: "experimental"
    clustering:
      enabled: true
      # Keeps its cluster metrics (and the clustering alerts) apart from the OTLP Deployment's
      name: alloy-logs
    # Alloy's state, including the log read positions, lives on the PVC
    storagePath: /var/lib/alloy
    mounts:
      extra:
        - name: storage
          mountPath: /var/lib/alloy
    configMap:
      create: false
      name: infra-alloy-logs
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# Pod log lines older than this are dropped instead of sent. Keep it within Loki's out-of-order
# window, max_chunk_age/2 (7m30s for charts/loki's 15m): Loki rejects lines further behind the
# newest line of their stream ("entry too far behind"). tests/loki-window.sh checks it.
maxLogAge: 7m30s

batching: {}
exporter:
  sending_queue:
    # queue_size: batches the exporter may queue. Unset, it's sized to each pod's memory limit
    # (2000 when there's no limit), so a backlog drops data instead of OOM-killing the pod:
    #   memory limit * memory_share / (batching.send_batch_max_size * bytes_per_record)
    # memory_share leaves the rest of the limit to the rest of the pipeline and the Go runtime.
    memory_share: 0.5
    # In-memory size of one log record, an estimate: prod held ~1000 queued batches when it hit
    # its 1Gi limit, which is ~512 B per record if they were full (2048+ records), as in a backlog.
    bytes_per_record: 1024
  retry_on_failure: {}

# Keep or drop log lines by content, before they are exported. Off by default.
# NOTE: this is a stopgap. Regex keep/drop filters do not scale as use cases are added. When
# another need comes up, write a dedicated Alloy pipeline for it (its own loki.process with
# parsing, labels and routing) instead of adding more logFilters entries.
# Each entry applies to one namespace (omit `namespace` for all collected ones):
#   keep: regexes that must ALL match the raw log line, otherwise the line is dropped
#   drop: regexes where ANY match drops the line
# Example (Gatekeeper violations of workload rules only):
# logFilters:
#   - namespace: gatekeeper-system
#     keep:
#       - '"event_type":\s*"violation"'
#       - '"constraint_name":\s*"workload-[^"]*"'
logFilters: []
