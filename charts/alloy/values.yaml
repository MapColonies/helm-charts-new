namespaces:
  - default

alloy:
  image:
    repository: infra/grafana/alloy
  serviceAccount:
    create: false
    name: alloy-kube-api
  rbac:
    create: false
  configReloader:
    image:
      repository: infra/grafana/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0
    resources:
      limits:
        cpu: 40m

  crds:
    create: false

  controller:
    type: 'deployment'
    podLabels:
      mapcolonies.io/component: "infrastructure"
      mapcolonies.io/part-of: "monitoring"
      mapcolonies.io/owner: "infra"
      mapcolonies.io/criticality: "internal"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"

  alloy:
    enableReporting: false
    stabilityLevel: "experimental"
    clustering:
      enabled: true
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
      # The pod logs the alloy-logs StatefulSet forwards (Loki push API)
      - name: loki-push
        port: 3100
        targetPort: 3100
        protocol: TCP
    configMap:
      create: false
      name: infra-alloy

# Scaling out makes peers re-read a restarted replica's pods, re-sending lines.
alloy-logs:
  # Doesn't inherit alloy.*: set the image registry and pull secrets under the top-level global.image.
  image:
    repository: infra/grafana/alloy
  serviceAccount:
    create: false
    name: alloy-kube-api
  rbac:
    create: false
  configReloader:
    image:
      repository: infra/grafana/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0
    resources:
      limits:
        cpu: 40m

  crds:
    create: false

  controller:
    type: 'statefulset'
    replicas: 1
    # Needs Kubernetes 1.27+; older API servers drop it and keep the PVCs. For a clean start there:
    #   oc delete pvc -n <namespace> -l app.kubernetes.io/name=alloy-logs,app.kubernetes.io/instance=<release>
    enableStatefulSetAutoDeletePVC: true
    # Overriding this list replaces it: give the whole claim template, e.g. to set storageClassName.
    volumeClaimTemplates:
      - metadata:
          name: storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    podLabels:
      mapcolonies.io/component: "infrastructure"
      mapcolonies.io/part-of: "monitoring"
      mapcolonies.io/owner: "infra"
      mapcolonies.io/criticality: "internal"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"

  alloy:
    enableReporting: false
    stabilityLevel: "experimental"
    clustering:
      enabled: true
      # Keeps its cluster metrics (and the clustering alerts) apart from the OTLP Deployment's
      name: alloy-logs
    storagePath: /var/lib/alloy
    mounts:
      extra:
        - name: storage
          mountPath: /var/lib/alloy
    configMap:
      create: false
      name: infra-alloy-logs
    # /-/ready, not /-/healthy, which also fails on transient component errors.
    livenessProbe:
      httpGet:
        path: /-/ready
        port: 12345
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    resources:
      requests:
        cpu: 125m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Older pod log lines are dropped. Must stay under Loki's max_chunk_age/2 minus the batch timeout,
# retry max_elapsed_time and client timeout (tests/loki-window.sh). An outage longer than this
# loses its oldest lines.
maxLogAge: 5m30s

sampling:
  # Log sampling by severity; set rates per environment.
  # Each key is a severity, matched case-insensitively against the log record's severity_text
  # after OTel parsing (e.g. `info` matches "INFO" and "Info"). severity_text comes from OTLP,
  # from "SeverityText" in OTel-format JSON, or from "level" in pino JSON. Any severity string is accepted.
  # Each value is the fraction of logs to keep: 0 drops all of them, 0.0001 to 1 keeps that fraction
  # (0.1 keeps 10%), 1 keeps all. Unlisted severities and logs without one (plain-text lines) are kept.
  # Sampling happens inside Alloy, so it does not reduce the amount of data sent to Alloy.
  # Removed logs are counted in two metrics, totals with no per-severity label:
  #   rate 0: otelcol_processor_filter_logs_filtered_total{component_id="otelcol.processor.filter.log_sampling_drop"}
  #   others: otelcol_processor_probabilistic_sampler_count_logs_sampled_total{policy="sampling_priority",sampled="false"}
  # Example:
  # log:
  #   trace: 0
  #   debug: 0
  #   info: 0.2
  #   warn: 0.5
  log: {}

# Grafana alert rules in files/alerts (templates/alerts.yaml).
alerts:
  # Team that owns the rules: their alert_team label (which Slack channel they reach) and
  # the top-level Grafana folder.
  team: infra
  # Folder under the team folder. The rules land in <team>/<component>, e.g. infra/Alloy.
  # Letters, digits, space, - and _ only: the value is written inside a quoted YAML string.
  component: Alloy

# Grafana dashboards in files/dashboards (templates/dashboards.yaml), loaded by the Grafana dashboards sidecar.
dashboards:
  enabled: true
  # Grafana folder (sidecar folder annotation). "/" nests folders.
  # Empty = the alert rules' folder, <alerts.team>/<alerts.component> (infra/Alloy).
  folder: ""
  # Namespace for the ConfigMap. Must be one the Grafana sidecar watches. Empty = release namespace.
  namespace: ""
  # UIDs of the Grafana datasources the dashboards read. The dashboards' datasource dropdowns are
  # set to these and hidden.
  prometheusDatasourceUid: prometheus
  lokiDatasourceUid: loki

batching: {}
exporter:
  sending_queue:
    # Unset queue_size is sized from the pod's memory limit with these two (templates/_helpers.tpl).
    memory_share: 0.5
    # An estimate, from prod's ~1000 queued batches at its 1Gi limit.
    bytes_per_record: 1024
  retry_on_failure: {}

# Keep or drop log lines by content, before they are exported. Off by default.
# NOTE: this is a stopgap. Regex keep/drop filters do not scale as use cases are added. When
# another need comes up, write a dedicated Alloy pipeline for it (its own loki.process with
# parsing, labels and routing) instead of adding more logFilters entries.
# Each entry applies to one namespace (omit `namespace` for all collected ones):
#   keep: regexes that must ALL match the raw log line, otherwise the line is dropped
#   drop: regexes where ANY match drops the line
# Example (Gatekeeper violations of workload rules only):
# logFilters:
#   - namespace: gatekeeper-system
#     keep:
#       - '"event_type":\s*"violation"'
#       - '"constraint_name":\s*"workload-[^"]*"'
logFilters: []

# Always set service.port: without it the route goes to the Service's first port,
# http-metrics (12345, the Alloy UI and debug API), not OTLP.
# openshift-routes:
#   routes:
#     - name: alloy-otlp
#       service:
#         name: infra-alloy
#         port: otlp-http
