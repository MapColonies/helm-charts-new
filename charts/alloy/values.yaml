namespaces:
  - default

alloy:
  image:
    repository: infra/grafana/alloy
  serviceAccount:
    create: false
    name: alloy-kube-api
  rbac:
    create: false
  configReloader:
    image:
      repository: infra/grafana/prometheus-operator/prometheus-config-reloader
      tag: v0.91.0

  crds:
    create: false

  controller:
    type: 'deployment'
    podLabels:
      mapcolonies.io/component: "infrastructure"
      mapcolonies.io/part-of: "monitoring"
      mapcolonies.io/owner: "infra"
      mapcolonies.io/criticality: "internal"
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "12345"

  alloy:
    enableReporting: false
    stabilityLevel: "experimental"
    clustering:
      enabled: true
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    configMap:
      create: false
      name: infra-alloy

batching: {}
exporter:
  sending_queue: {}
  retry_on_failure: {}

# Keep or drop log lines by content, before they are exported. Off by default.
# Each entry applies to one namespace (omit `namespace` for all collected ones):
#   keep: regexes that must ALL match the raw log line, otherwise the line is dropped
#   drop: regexes where ANY match drops the line
# Example (Gatekeeper violations of workload rules only):
# logFilters:
#   - namespace: gatekeeper-system
#     keep:
#       - '"event_type":\s*"violation"'
#       - '"constraint_name":\s*"workload-[^"]*"'
logFilters: []
