apiVersion: 1
groups:
  - orgId: 1
    name: alloy_pod_logs
    folder: Alloy
    interval: 1m
    rules:
      - uid: alloy-pod-logs-down
        title: AlloyPodLogsDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (cluster, namespace, statefulset) (kube_statefulset_replicas{statefulset=~".*alloy-logs"} - kube_statefulset_status_replicas_ready{statefulset=~".*alloy-logs"}) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          alert_team: infra
        annotations:
          summary: Pod logs are not being collected.
          description: "{{ $value }} replica(s) of StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} not ready for 5m, so pod logs aren't tailed, and lines older than maxLogAge by the time it's back are lost. If its pod is stuck Terminating on a failed node, fence the node or force-delete the pod (oc delete pod --force --grace-period=0) so it's recreated elsewhere."
