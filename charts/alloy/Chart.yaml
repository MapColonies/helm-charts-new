apiVersion: v2
name: alloy
description: A wrapper alloy Helm chart for adding custom config for alloy
type: application
version: 1.3.0
appVersion: v1.17.0
annotations:
  domain: infra
dependencies:
  - name: alloy
    repository: https://grafana.github.io/helm-charts
    version: 1.10.0
  # Same chart again, as the StatefulSet that collects pod logs (values under `alloy-logs`)
  - name: alloy
    alias: alloy-logs
    repository: https://grafana.github.io/helm-charts
    version: 1.10.0
