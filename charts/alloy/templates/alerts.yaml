apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    mapcolonies.io/grafana-alerts: "true"
data:
{{- /* Not run through tpl: the rules hold Grafana's own {{ $labels }} templates. The pod logs
       StatefulSet's name is filled in where a rule has the placeholder. */}}
{{- range $path, $_ := .Files.Glob "files/alerts/*.yaml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | replace "__ALLOY_LOGS_STATEFULSET__" (include "alloy-wrapper.podLogsStatefulSet" $) | indent 4 }}
{{- end }}
