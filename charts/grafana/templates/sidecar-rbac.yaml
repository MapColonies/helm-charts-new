{{- range .Values.grafana.sidecar.alerts.searchNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-reader
  namespace: {{ . }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-reader
  namespace: {{ . }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-reader
subjects:
  - kind: ServiceAccount
    name: monitoring
    namespace: {{ $.Release.Namespace }}
{{- end }}
