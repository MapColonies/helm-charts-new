{{- /*
Only created when at least one team sets an inline `url` (legacy path). Teams without a url
get their webhook from a Secret created outside the chart (see values.yaml), so an external
Secret, even one named grafana-webhooks, never collides with a chart-created one.
*/ -}}
{{- $hasInlineUrl := false }}
{{- range .Values.grafana.alertingTeamsWebhooks }}
{{- if .url }}{{ $hasInlineUrl = true }}{{ end }}
{{- end }}
{{- if $hasInlineUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-webhooks
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
{{- with .Values.grafana.alertingTeamsWebhooks }}
stringData:
  {{- range . }}
  {{- if .url }}
  {{ include "grafana.webhookEnv" .team }}: {{ .url | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
