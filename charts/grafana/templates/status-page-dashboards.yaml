apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-status-page-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    mapcolonies.io/grafana-dashboards: "true"
  annotations:
    mapcolonies.io/grafana-dashboards-folder: Status Page
data:
{{ (.Files.Glob "files/dashboards/status-page/*.json").AsConfig | indent 2 }}
