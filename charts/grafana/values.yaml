grafana:
  extraLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "monitoring"
    mapcolonies.io/owner: "infra"
    mapcolonies.io/criticality: "internal"
  podLabels:
    mapcolonies.io/alloy-api-logs: "true"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"

  image:
    tag: 1.1.1

  rbac:
    create: false
  serviceAccount:
    create: false
    name: monitoring

  grafana.ini:
    metrics:
      enabled: "true"
    paths:
      plugins: /var/lib/grafana-plugins
