grafana:
  extraLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "monitoring"
    mapcolonies.io/owner: "infra"
  podLabels:
    mapcolonies.io/alloy-api-logs: "true"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"

  image:
    tag: 1.1.1

  rbac:
    create: false
  serviceAccount:
    create: false
    name: monitoring

  sidecar:
    searchNamespace: null
    resources:
      limits:
        cpu: 50m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    securityContext:
      runAsUser: 1000810000
    dashboards:
      enabled: true
      label: "mapcolonies.io/grafana-dashboards"
      folderAnnotation: "mapcolonies.io/grafana-dashboards-folder"
      provider:
        foldersFromFilesStructure: true

  grafana.ini:
    metrics:
      enabled: "true"
    paths:
      plugins: /var/lib/grafana-plugins
