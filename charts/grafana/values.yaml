grafana:
  extraLabels:
    mapcolonies.io/component: "infrastructure"
    mapcolonies.io/part-of: "monitoring"
    mapcolonies.io/owner: "infra"
    mapcolonies.io/criticality: "internal"
  podLabels:
    mapcolonies.io/alloy-api-logs: "true"
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"

  image:
    tag: 1.1.1

  rbac:
    create: false
  serviceAccount:
    create: false
    name: monitoring

  sidecar:
    image:
      repository: infra/kiwigrid/k8s-sidecar
    resources:
      limits:
        cpu: 50m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 32Mi
    dashboards:
      enabled: true
      label: "mapcolonies.io/grafana-dashboards"
      searchNamespace: null
      folderAnnotation: "mapcolonies.io/grafana-dashboards-folder"
      provider:
        foldersFromFilesStructure: true
    alerts:
      enabled: true
      label: "mapcolonies.io/grafana-alerts"
      searchNamespace: null
    datasources:
      enabled: true
      label: "mapcolonies.io/grafana-datasources"
      searchNamespace: null

  # Alerting Teams Webhooks
  # List of teams that get a contact point `<team>-alerts` (receiver type: alertingReceiverType).
  # Each contact point reads its webhook URL from the env var `<TEAM>_WEBHOOK` (team upper-cased, `-` as `_`).
  # A team starting with a digit gets a `TEAM_` prefix, e.g. `3d` -> `TEAM_3D_WEBHOOK`, since env var
  # names cannot start with a digit. Team names may only contain a-z, 0-9, - and _ (else render fails).
  # Every team also gets `<team>-alerts-no-resolve`: same webhook, no "resolved" messages. The
  # notification policy sends alerts labelled `notify_resolved="false"` there (one notification
  # per alert); all other alerts keep `<team>-alerts` and their resolved messages.
  #
  # Preferred: keep URLs out of values. List only the team and create the Secret yourself,
  # outside the chart, with one key per team:
  #   kubectl create secret generic grafana-webhooks-external -n <ns> \
  #     --from-literal=INFRA_WEBHOOK='<webhook url>' --from-literal=RASTER_WEBHOOK='<webhook url>'
  #   alertingTeamsWebhooks:
  #     - team: "infra"
  # Each team's env var is read with secretKeyRef (optional: false) from alertingWebhooksSecret
  # (below). Add the key before adding the team: helm install/upgrade fails while the Secret exists
  # without it. If the key is still missing when the pod starts (e.g. the Secret did not exist
  # yet), the new pod waits in CreateContainerConfigError ("couldn't find key <TEAM>_WEBHOOK in
  # Secret ...") and the old pod keeps serving until its Grafana container restarts: it has
  # already loaded the new contact points, which use the missing variable.
  # Do not name the Secret grafana-webhooks: that is the Secret the chart creates for inline urls
  # (below), and a Secret that Helm did not create under that name makes install, upgrade and
  # rollback fail on ownership metadata.
  # Upgrading from 1.2.0 with envFromSecrets set to a Secret of another name: set
  # alertingWebhooksSecret to that name instead, envFromSecrets no longer loads the webhooks.
  #
  # Legacy: set `url` inline. The chart then creates Secret grafana-webhooks itself and the
  # team's env var reads it from there:
  #   - team: "infra"
  #     url: "https://example.com/webhook"
  #
  # An entry for the same env var name in envValueFrom or env takes precedence over the above.
  alertingTeamsWebhooks: []

  # Alerting Receiver Type
  # This is the type of receiver to use for Grafana alerting.
  # Example:
  # alertingReceiverType: "slack"
  alertingReceiverType: ""

  # Secret with the webhook keys of teams that do not set `url` (see alertingTeamsWebhooks).
  alertingWebhooksSecret: grafana-webhooks-external

  grafana.ini:
    unified_alerting:
      enabled: true
    metrics:
      enabled: "true"
    paths:
      plugins: /var/lib/grafana-plugins
