name: pull request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_domain:
    name: Validate chart domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate domain annotation
        # shortcut: pinned to MapColonies/shared-workflows#118 head; switch to validate-domain-v1.1.0 once released.
        uses: MapColonies/shared-workflows/actions/validate-domain@1b6868d2dc1de7a4bc920cb02253d52dcaa04320
        with:
          chart-file: charts/*/Chart.yaml
