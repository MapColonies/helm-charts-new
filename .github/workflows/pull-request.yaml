name: pull request

on:
  pull_request:

jobs:
  discover_charts:
    name: Discover Helm charts
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.set-matrix.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Find Chart.yaml files
        id: set-matrix
        run: |
          # Find charts under the top-level charts/ directory (only immediate children)
          # This avoids picking up nested subcharts like <chart>/charts/*/Chart.yaml
          files=$(find ./charts -mindepth 2 -maxdepth 2 -type f -name 'Chart.yaml' -print | jq -R -s -c 'split("\n")[:-1]')
          echo "Discovered charts: $files"
          echo "charts=$files" >> "$GITHUB_OUTPUT"

  validate_domain:
    name: Validate chart domain
    needs: discover_charts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.discover_charts.outputs.charts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Validate domain for ${{ matrix.chart }}
        uses: MapColonies/shared-workflows/actions/validate-domain@validate-domain-v1.0.0
        with:
          chart-file: ${{ matrix.chart }}

  test_gatekeeper_constraints:
    name: Test gatekeeper-constraints chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for gatekeeper-constraints changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chart:
              - 'charts/gatekeeper-constraints/**'

      - name: Set up Helm
        if: steps.filter.outputs.chart == 'true'
        uses: azure/setup-helm@v4

      - name: Run chart tests
        if: steps.filter.outputs.chart == 'true'
        run: make -C charts/gatekeeper-constraints test

  test_blackbox_lib:
    name: Test blackbox-lib chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for blackbox-lib changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chart:
              - 'charts/blackbox-lib/**'

      - name: Set up Helm
        if: steps.filter.outputs.chart == 'true'
        uses: azure/setup-helm@v4

      - name: Run chart tests
        if: steps.filter.outputs.chart == 'true'
        run: make -C charts/blackbox-lib test

  test_blackbox_exporter:
    name: Test blackbox-exporter chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The test renders both charts together, so a change to either one must run it.
      - name: Check for blackbox-exporter or blackbox-lib changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chart:
              - 'charts/blackbox-exporter/**'
              - 'charts/blackbox-lib/**'

      - name: Set up Helm
        if: steps.filter.outputs.chart == 'true'
        uses: azure/setup-helm@v4

      - name: Run chart tests
        if: steps.filter.outputs.chart == 'true'
        run: make -C charts/blackbox-exporter test

  test_alloy:
    name: Test alloy chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for alloy changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chart:
              - 'charts/alloy/**'

      - name: Set up Helm
        if: steps.filter.outputs.chart == 'true'
        uses: azure/setup-helm@v4

      - name: Run chart tests
        if: steps.filter.outputs.chart == 'true'
        run: make -C charts/alloy test
