name: pull request

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate_domain:
    name: Validate chart domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # One job for all charts instead of a per-chart matrix: each job is billed at least a minute.
      - name: Validate domain annotation
        env:
          # Keep in sync with MapColonies/shared-workflows actions/validate-domain.
          ALLOWED_DOMAINS: "raster,vector,infra,3d,app,dem,common"
        run: |
          failed=0
          for chart in charts/*/Chart.yaml; do
            domain=$(yq e '.annotations.domain' "$chart")
            if ! tr ',' '\n' <<< "$ALLOWED_DOMAINS" | grep -qx "$domain"; then
              echo "::error file=$chart::Invalid domain: $domain"
              failed=1
            fi
          done
          exit $failed
