name: blackbox-exporter

on:
  pull_request:
    # The test renders both charts together, so a change to either one must run it.
    paths:
      - 'charts/blackbox-exporter/**'
      - 'charts/blackbox-lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test blackbox-exporter chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run chart tests
        run: make -C charts/blackbox-exporter test
